<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BaiMarket API Test</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #050807;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.box {
    width: 100%;
    max-width: 600px;
    background: #0b100d;
    border: 1px solid #1b2921;
    border-radius: 14px;
    padding: 25px;
}

h1 {
    margin: 0 0 8px;
}

h1 span {
    color: #35d875;
}

p {
    color: #89968e;
}

button {
    width: 100%;
    border: 0;
    border-radius: 8px;
    padding: 12px;
    background: #35d875;
    color: #031108;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #55e889;
}

pre {
    margin-top: 18px;
    padding: 15px;
    border-radius: 9px;
    background: #050907;
    border: 1px solid #18251e;
    color: #9ae8b4;
    overflow: auto;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="box">

    <h1>BaiMarket<span>.</span></h1>

    <p>
        Pterodactyl API connection testing
    </p>

    <button onclick="testAPI()">
        TEST API
    </button>

    <pre id="result">Belum melakukan testing.</pre>

</div>

<script>
async function testAPI() {

    const result = document.getElementById("result");

    result.textContent = "Menghubungkan ke Pterodactyl...";

    try {

        const response = await fetch("/api/ptero");

        const data = await response.json();

        result.textContent =
            JSON.stringify(data, null, 2);

    } catch (error) {

        result.textContent =
            "ERROR: " + error.message;

    }
}
</script>

</body>
</html>
